<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Dijital Kartvizit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060810;
  --surface: rgba(13,16,30,0.8);
  --surface-solid: #0d101e;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(0,200,255,0.18);
  --primary: #00c8ff;
  --accent: #8b5cf6;
  --emerald: #10b981;
  --text: #e6e6f0;
  --muted: #7a7a9e;
  --radius: 18px;
  --radius-sm: 12px;
  --ease: cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}

/* Ambient */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform}
.orb-1{width:600px;height:600px;background:var(--primary);opacity:.07;top:-25%;left:-20%;animation:f1 28s ease-in-out infinite}
.orb-2{width:500px;height:500px;background:var(--accent);opacity:.06;bottom:-20%;right:-15%;animation:f2 32s ease-in-out infinite}
.orb-3{width:350px;height:350px;background:var(--emerald);opacity:.05;top:45%;left:60%;animation:f3 24s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(80px,60px) scale(1.05)}66%{transform:translate(-30px,90px) scale(.95)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-70px,-50px) scale(.92)}66%{transform:translate(50px,-80px) scale(1.08)}}
@keyframes f3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,-40px) scale(1.15)}}

.page{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:14px}

/* Reveal */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s var(--ease),transform .65s var(--ease)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* Profile */
.profile{background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius);padding:36px 24px 28px;text-align:center;position:relative;overflow:hidden}
.profile::before{content:'';position:absolute;top:0;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,var(--primary),var(--accent),transparent);border-radius:2px}
.avatar-wrap{width:96px;height:96px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,var(--primary),var(--accent),var(--emerald),var(--primary));margin:0 auto 18px;animation:rs 6s linear infinite}
@keyframes rs{to{transform:rotate(360deg)}}
.avatar{width:100%;height:100%;border-radius:50%;background:var(--surface-solid);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--primary);overflow:hidden;animation:rc 6s linear infinite}
@keyframes rc{to{transform:rotate(-360deg)}}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:4px}
.profile .title{font-size:.84rem;color:var(--muted);margin-bottom:4px}
.profile .company{font-size:.95rem;font-weight:600;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Actions */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:var(--radius);background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);text-decoration:none;color:var(--text);font-size:.72rem;font-weight:500;transition:all .3s var(--ease);cursor:pointer}
.act:hover,.act:active{border-color:var(--border-hover);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.act-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:transform .3s ease}
.act:hover .act-icon{transform:scale(1.1)}

/* Card */
.card{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .3s ease}
.card:hover{border-color:rgba(255,255,255,.08)}
.card-header{padding:16px 20px 12px;font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted)}

/* About */
.about-text{padding:0 20px 20px;font-size:.88rem;line-height:1.75;color:var(--muted)}

/* Instagram */
.ig-card{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(225,48,108,.15);border-radius:var(--radius);padding:22px 20px;position:relative;overflow:hidden;text-decoration:none;display:block;color:var(--text);transition:all .3s var(--ease)}
.ig-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.ig-card:hover{border-color:rgba(225,48,108,.28);transform:translateY(-2px);box-shadow:0 8px 28px rgba(225,48,108,.1)}
.ig-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ig-icon{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:flex;align-items:center;justify-content:center}
.ig-icon svg{width:24px;height:24px;fill:#fff}
.ig-user{font-weight:700;font-size:.95rem}
.ig-handle{font-size:.78rem;color:var(--muted)}

/* Instagram stats */
.ig-stats{display:flex;text-align:center;margin-bottom:14px;padding:12px 0;border-top:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.04)}
.ig-stat{flex:1}
.ig-stat-num{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;color:var(--text);display:block}
.ig-stat-num.highlight{font-size:1.3rem;background:linear-gradient(135deg,#f09433,#dc2743,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ig-stat-label{font-size:.65rem;color:var(--muted);margin-top:2px;display:block}

.ig-desc{font-size:.82rem;color:var(--muted);line-height:1.6;margin-bottom:14px}
.ig-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;font-size:.8rem;font-weight:600;transition:all .3s ease}
.ig-card:hover .ig-btn{box-shadow:0 4px 16px rgba(225,48,108,.3)}
.ig-btn svg{width:14px;height:14px;fill:#fff}

/* Videos */
.video-list{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.video-card{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:#000;cursor:pointer;transition:all .35s var(--ease);position:relative}
.video-card:hover{border-color:var(--border-hover);transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.video-card.playing{cursor:default}
.video-card.playing:hover{transform:none;box-shadow:none;border-color:var(--border-hover)}
.video-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000}
.video-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.video-card:not(.playing):hover .video-thumb img{transform:scale(1.05)}
.video-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,rgba(0,0,0,.12) 50%,rgba(0,0,0,.08) 100%);transition:background .3s ease}
.video-card:hover .video-overlay{background:linear-gradient(to top,rgba(0,0,0,.35) 0%,transparent 50%)}
.play-btn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.35);transition:all .3s ease;position:relative}
.play-btn::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.3);animation:pr 2s ease-out infinite}
@keyframes pr{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.video-card:hover .play-btn{transform:scale(1.1)}
.play-btn svg{width:18px;height:18px;fill:#111;margin-left:2px}
.video-info{padding:10px 14px;background:var(--surface-solid)}
.video-title{font-size:.84rem;font-weight:600}
.video-desc{font-size:.72rem;color:var(--muted);margin-top:2px}
.video-close{position:absolute;top:10px;right:10px;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:1.1rem;display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1;transition:all .2s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.video-close:hover{background:rgba(255,50,50,.6);border-color:rgba(255,100,100,.3)}
.video-card.playing .video-close{display:flex}
.video-thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Pills */
.pills{padding:0 16px 16px;display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 14px;border-radius:10px;background:rgba(0,200,255,.05);border:1px solid rgba(0,200,255,.1);font-size:.8rem;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .25s ease}
.pill:hover{background:rgba(0,200,255,.1);border-color:rgba(0,200,255,.22);transform:translateY(-1px)}

/* Links */
.link-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--border);text-decoration:none;color:var(--text);font-size:.84rem;font-weight:400;transition:all .25s ease}
.link-row:first-of-type{border-top:none}
.link-row:hover{background:rgba(255,255,255,.02)}
.link-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem;transition:transform .25s ease}
.link-row:hover .link-icon{transform:scale(1.08)}
.link-arrow{margin-left:auto;color:var(--muted);font-size:.8rem;transition:transform .25s ease}
.link-row:hover .link-arrow{transform:translateX(3px)}

.foot{text-align:center;font-size:.68rem;color:var(--muted);opacity:.35;padding-top:8px}
@media(min-width:600px){body{display:flex;align-items:flex-start;justify-content:center;padding:40px 20px}}
</style>
</head>
<body>

<script>

  ],
};

// ══════════════════════════════════════════════════════
//  BURADAN AŞAĞISINA DOKUNMAYIN
// ══════════════════════════════════════════════════════

(function() {
  var C = YAPILANDIRMA;
  var app = document.getElementById('app');
  document.title = C.kisi.ad + ' — ' + C.kisi.firma;

  // OG tags
  function setMeta(p, v) { var m = document.querySelector('meta[property="'+p+'"]'); if(!m){m=document.createElement('meta');m.setAttribute('property',p);document.head.appendChild(m)} m.content=v; }
  setMeta('og:title', C.kisi.ad + ' — ' + C.kisi.firma);
  setMeta('og:description', C.hakkinda.substring(0,150));
  if(C.videolar.length) setMeta('og:image','https://img.youtube.com/vi/'+C.videolar[0].id+'/maxresdefault.jpg');

  // Helpers
  function ini(n){return n.split(' ').map(function(w){return w[0]}).join('').toUpperCase().substring(0,2)}
  function waUrl(){return 'https://wa.me/'+C.iletisim.telefonLink+'?text='+encodeURIComponent(C.iletisim.whatsappMesaj)}
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

  var igSvg='<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>';

  var h='';

  // PROFILE
  h+='<div class="profile reveal"><div class="avatar-wrap"><div class="avatar">';
  h+=C.kisi.foto?'<img src="'+C.kisi.foto+'" alt="'+esc(C.kisi.ad)+'">':ini(C.kisi.ad);
  h+='</div></div><h1>'+esc(C.kisi.ad)+'</h1><div class="title">'+esc(C.kisi.unvan)+'</div><div class="company">'+esc(C.kisi.firma)+'</div></div>';

  // ACTIONS
  h+='<div class="actions reveal">';
  h+='<a href="'+waUrl()+'" target="_blank" rel="noopener" class="act"><div class="act-icon" style="background:rgba(37,211,102,.15)">💬</div>WhatsApp</a>';
  h+='<a href="tel:+'+esc(C.iletisim.telefonLink)+'" class="act"><div class="act-icon" style="background:rgba(0,200,255,.15)">📞</div>Ara</a>';

  // ABOUT

  // INSTAGRAM
  if(C.instagram&&C.instagram.url){
    var ig=C.instagram;
    h+='<a href="'+esc(ig.url)+'" target="_blank" rel="noopener" class="ig-card reveal">';
    h+='<div class="ig-head"><div class="ig-icon">'+igSvg+'</div>';
    h+='<div><div class="ig-user">'+esc(ig.profilAdi||C.kisi.firma)+'</div>';
    h+='<div class="ig-handle">'+esc(ig.kullaniciAdi)+'</div></div></div>';
    // Stats
    if(ig.takipci){
      h+='<div class="ig-stats">';
      h+='<div class="ig-stat"><span class="ig-stat-num">'+esc(String(ig.gonderi||0))+'</span><span class="ig-stat-label">Gönderi</span></div>';
      h+='<div class="ig-stat"><span class="ig-stat-num highlight">'+esc(String(ig.takipci))+'</span><span class="ig-stat-label">Takipçi</span></div>';
      h+='<div class="ig-stat"><span class="ig-stat-num">'+esc(String(ig.takipEdilen||0))+'</span><span class="ig-stat-label">Takip</span></div>';
      h+='</div>';
    }
    h+='<div class="ig-desc">'+esc(ig.aciklama)+'</div>';
    h+='<div class="ig-btn">'+igSvg+' Takip Et</div></a>';
  }

  // VIDEOS
  if(C.videolar.length){
    h+='<div class="card reveal" id="video-section"><div class="card-header">Çalışmalarımız</div><div class="video-list">';
    C.videolar.forEach(function(v,i){

      h+='<div class="video-thumb">';

      h+='<a href="'+esc(l.url)+'" target="_blank" rel="noopener" class="link-row"><div class="link-icon" style="background:'+l.renk+'">'+l.ikon+'</div><span>'+esc(l.baslik)+'</span><span class="link-arrow">→</span></a>';

  // FOOTER
  h+='<div class="foot reveal">&copy; '+new Date().getFullYear()+' '+esc(C.kisi.firma)+' — Dijital Kartvizit</div>';

  app.innerHTML=h;

  // ── SCROLL REVEAL ──
  var reveals=document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    var ro=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');ro.unobserve(e.target)}})},{threshold:.1,rootMargin:'0px 0px -40px 0px'});
    reveals.forEach(function(el,i){el.style.transitionDelay=(i*.07)+'s';ro.observe(el)});
  }else{
    reveals.forEach(function(el){el.classList.add('visible')});
  }

  // ── VIDEO PLAYER ──
  var thumbCache={};

  function embedVideo(index, muted){
    var card=document.getElementById('vid-'+index);
    if(!card||card.classList.contains('playing')) return;
    var thumb=card.querySelector('.video-thumb');
    var vid=C.videolar[index].id;

    if(!thumbCache[index]) thumbCache[index]=thumb.innerHTML;

    var params='?rel=0&autoplay=1&playsinline=1&modestbranding=1&enablejsapi=1';
    if(muted) params+='&mute=1';
    thumb.innerHTML='<iframe src="https://www.youtube.com/embed/'+vid+params+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    card.classList.add('playing');
  }

  function restoreVideo(index){
    var card=document.getElementById('vid-'+index);
    if(!card) return;
    var thumb=card.querySelector('.video-thumb');
    if(thumbCache[index]){
      thumb.innerHTML=thumbCache[index];
      delete thumbCache[index];
    }
    card.classList.remove('playing');
  }

  // Click handlers via event delegation
  var videoSection=document.getElementById('video-section');
  if(videoSection){
    videoSection.addEventListener('click',function(e){
      // Close button
      var closeBtn=e.target.closest('.video-close');
      if(closeBtn){
        e.stopPropagation();
        var card=closeBtn.closest('.video-card');
        if(card){
          var idx=parseInt(card.id.replace('vid-',''));
          restoreVideo(idx);
        }
        return;
      }
      // Video card click
      var card=e.target.closest('.video-card');
      if(card&&!card.classList.contains('playing')){
        var idx=parseInt(card.id.replace('vid-',''));
        embedVideo(idx, false); // Manuel tıklama = sesli
      }
    });
  }

  // Auto-play: embed videos when scrolled into view (after reveal animations finish)
  setTimeout(function(){
    if(!('IntersectionObserver' in window)) return;
    var vidObs=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var card=entry.target;
        var idx=parseInt(card.id.replace('vid-',''));
        if(entry.isIntersecting && !card.classList.contains('playing')){
          embedVideo(idx, true); // Otomatik = sessiz
        }
      });
    },{threshold:0.35});

    document.querySelectorAll('.video-card').forEach(function(c){vidObs.observe(c)});
  }, 1200); // Reveal animasyonları tamamlansın

})();
</script>
</body>
</html>
