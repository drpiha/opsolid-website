<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elif Celik - Fotograf Sanatcisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111111;
    --bg-card: #1a1a1a;
    --accent: #e8c472;
    --accent-dim: rgba(232, 196, 114, 0.15);
    --white: #ffffff;
    --white-90: rgba(255,255,255,0.9);
    --white-60: rgba(255,255,255,0.6);
    --white-30: rgba(255,255,255,0.3);
    --white-12: rgba(255,255,255,0.12);
    --white-06: rgba(255,255,255,0.06);
    --gap: 4px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--white);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  .card-wrapper {
    width: 100%;
    max-width: 460px;
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Scroll reveal */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* 1. Minimal Header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--white-06);
  }
  .header img {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }
  .header-text h1 {
    font-family: 'Space Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    letter-spacing: -0.3px;
  }
  .header-text p {
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 400;
    margin-top: 1px;
    letter-spacing: 0.3px;
  }

  /* 2. Category Filter Bar */
  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 18px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-pill {
    flex-shrink: 0;
    padding: 7px 18px;
    border-radius: 50px;
    border: 1.5px solid var(--white-30);
    background: transparent;
    color: var(--white-60);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .filter-pill:hover {
    border-color: var(--white-60);
    color: var(--white-90);
  }
  .filter-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }

  /* 3. Masonry Gallery */
  .masonry {
    column-count: 2;
    column-gap: var(--gap);
    padding: 0 var(--gap) var(--gap);
  }
  .masonry-item {
    break-inside: avoid;
    margin-bottom: var(--gap);
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    display: block;
  }
  .masonry-item.hidden {
    display: none;
  }
  .masonry-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .masonry-item:hover img {
    transform: scale(1.04);
  }
  .masonry-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    align-items: flex-end;
    padding: 12px;
  }
  .masonry-item:hover .masonry-overlay {
    opacity: 1;
  }
  .masonry-overlay span {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--white);
    letter-spacing: 0.2px;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .lightbox.active {
    opacity: 1;
    pointer-events: all;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: var(--white);
    font-size: 22px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    z-index: 1001;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.2); }
  .lightbox-img {
    max-width: 92%;
    max-height: 75vh;
    object-fit: contain;
    border-radius: 4px;
    transform: scale(0.92);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lightbox.active .lightbox-img {
    transform: scale(1);
  }
  .lightbox-title {
    margin-top: 16px;
    font-size: 14px;
    color: var(--white-60);
    font-weight: 400;
    letter-spacing: 0.3px;
    text-align: center;
  }

  /* 4. About */
  .about-section {
    text-align: center;
    padding: 32px 28px;
    border-top: 1px solid var(--white-06);
  }
  .about-section p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--white-60);
    font-weight: 300;
  }

  /* 5. Contact Strip */
  .contact-strip {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 12px 20px 24px;
  }
  .contact-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid var(--white-12);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white-60);
    text-decoration: none;
    transition: all 0.25s ease;
  }
  .contact-icon:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }
  .contact-icon svg {
    width: 20px;
    height: 20px;
  }

  /* 6. QR Code */
  .qr-section {
    text-align: center;
    padding: 28px 20px;
    border-top: 1px solid var(--white-06);
  }
  .qr-label {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--white-30);
    margin-bottom: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #qrcode {
    display: inline-block;
    padding: 10px;
    background: var(--white);
    border-radius: 6px;
  }
  #qrcode img, #qrcode canvas { display: block; border-radius: 3px; }

  /* 7. vCard */
  .vcard-section {
    padding: 0 20px 16px;
  }
  .vcard-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 20px;
    border-radius: 8px;
    background: transparent;
    border: 1.5px solid var(--white-12);
    color: var(--white-60);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .vcard-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }
  .vcard-btn svg { width: 18px; height: 18px; }

  /* 8. Footer */
  .footer {
    text-align: center;
    padding: 20px;
    border-top: 1px solid var(--white-06);
  }
  .footer p {
    font-size: 11px;
    color: var(--white-30);
    letter-spacing: 0.5px;
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .reveal { transition: none; opacity: 1; transform: none; }
    .masonry-item img { transition: none; }
    .lightbox { transition: none; }
    .lightbox-img { transition: none; }
  }
</style>
</head>

<script>
  // Scroll Reveal with IntersectionObserver
  (function() {
    var revealEls = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
      var obs = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
      revealEls.forEach(function(el) { obs.observe(el); });
    } else {
      revealEls.forEach(function(el) { el.classList.add('visible'); });
    }
  })();

  // Category Filter
  (function() {
    var pills = document.querySelectorAll('.filter-pill');
    var items = document.querySelectorAll('.masonry-item');

    pills.forEach(function(pill) {
      pill.addEventListener('click', function() {
        // Update active state
        pills.forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');

        var filter = this.getAttribute('data-filter');

        items.forEach(function(item) {
          if (filter === 'all' || item.getAttribute('data-category') === filter) {
            item.classList.remove('hidden');
          } else {
            item.classList.add('hidden');
          }
        });
      });
    });
  })();

  // Lightbox
  function openLightbox(el) {
    var imgSrc = el.querySelector('img').src;
    var title = el.getAttribute('data-title');
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lightbox-img');
    var lbTitle = document.getElementById('lightbox-title');

    lbImg.src = imgSrc;
    lbImg.alt = title;
    lbTitle.textContent = title;
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    var lb = document.getElementById('lightbox');
    lb.classList.remove('active');
    document.body.style.overflow = '';
  }

  function closeLightboxBackdrop(e) {
    if (e.target === document.getElementById('lightbox')) {
      closeLightbox();
    }
  }

  // Close lightbox with Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });

  // QR Code
  (function() {
    var qrContainer = document.getElementById('qrcode');
    if (qrContainer && typeof QRCode !== 'undefined') {
      new QRCode(qrContainer, {
        text: window.location.href,
        width: 120,
        height: 120,
        colorDark: '#111111',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  })();

  // vCard Download
  function downloadVCard() {
    var vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Celik;Elif;;;',
      'FN:Elif Celik',
      'TITLE:Fotograf Sanatcisi',
      'TEL;TYPE=CELL:+90 537 555 66 77',
      'EMAIL:elif@elifcelik.com',
      'URL:https://instagram.com/elifcelik_photo',
      'NOTE:Fotograf Sanatcisi - Isigi ve ani yakaliyorum.',
      'END:VCARD'
    ].join('\r\n');

    var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Elif_Celik.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
</script>
