name: Verify web source (production disabled)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Production execution stays disabled until a separately reviewed app-only
# release path can preserve the current runtime role and private Compose state.
# The old source-sync/bootstrap/build deployment must not run on a merge.
# Manual dispatch below performs validation only; it cannot apply a packet.
jobs:
  verify:
    name: Verify (audit:cards gate)
    if: ${{ github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies (including required native modules)
        run: npm ci --no-audit --no-fund
      - name: Enforce validation-only workflow
        run: node --test scripts/tests/deploy-workflow.test.cjs
      - name: Generate Prisma client locally (no database connection)
        run: node node_modules/prisma/build/index.js generate
      - name: Card template fabricated-data audit
        run: npm run audit:cards
      - name: Lint application source
        run: npm run lint
      - name: Typecheck application source
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Canonical account contracts (simulated upstream)
        run: node --import tsx --test scripts/tests/opso-web-account.test.mts
      - name: App-only cutover contracts (synthetic, no Docker or provider)
        run: python3 -B scripts/tests/test_opsolid_app_cutover.py
      - name: Production build and public source-map gate
        run: npm run build
