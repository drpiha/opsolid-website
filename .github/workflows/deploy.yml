name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/daily-blog-update.yml"
      - "scripts/**"
      - "deploy/hostinger/**"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and ship to /opt/opsolid-website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Build deploy tarball
        run: |
          tar -czf /tmp/opsolid-deploy.tar.gz \
            --exclude='./.env' \
            --exclude='./.env.local' \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.design-bundle' \
            --exclude='./_kutasia_tmp' \
            --exclude='./tsconfig.tsbuildinfo' \
            .
          ls -lh /tmp/opsolid-deploy.tar.gz

      - name: Upload tarball to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            /tmp/opsolid-deploy.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/opsolid-deploy.tar.gz"

      - name: Extract and rebuild on VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -se <<'EOF'
          set -euo pipefail
          DEPLOY_DIR=/opt/opsolid-website
          TARBALL=/tmp/opsolid-deploy.tar.gz

          echo "==> Extracting tarball into $DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          tar -xzf "$TARBALL"

          echo "==> Rebuilding opsolid container (db and others untouched)"
          docker compose up -d --build opsolid

          echo "==> Cleaning up"
          rm -f "$TARBALL"

          echo "==> Container status"
          docker ps --filter "name=opsolid-app" --format "table {{.Names}}\t{{.Status}}"
          EOF

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Waiting 25s for container to settle..."
          sleep 25
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            'curl -fsS --max-time 10 http://127.0.0.1:3000/api/health || (echo "Health check failed"; docker logs --tail 80 opsolid-app; exit 1)'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
