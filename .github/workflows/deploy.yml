name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/daily-blog-update.yml"
      - "scripts/**"
      - "deploy/hostinger/**"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and ship to /opt/opsolid-website
    runs-on: [self-hosted, linux, vps]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract files to deploy directory
        run: |
          DEPLOY_DIR=/opt/opsolid-website

          echo "==> Syncing source files to $DEPLOY_DIR (mirror, with delete)"
          # --delete drops files on the VPS that no longer exist in the repo
          # (e.g. after a `git revert`). Without it, orphaned source files
          # break the next build because tsc/next picks them up. The exclude
          # list below is the protection layer for runtime data (uploads,
          # .env, prisma .next cache).
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.next' \
            --exclude='.design-bundle' \
            --exclude='_kutasia_tmp' \
            --exclude='tsconfig.tsbuildinfo' \
            --exclude='public/uploads' \
            ./ "$DEPLOY_DIR/"

      - name: Rebuild opsolid container
        run: |
          cd /opt/opsolid-website
          docker compose up -d --build opsolid

      - name: Health check
        run: |
          echo "Waiting 60s for build + startup..."
          sleep 60
          for attempt in $(seq 1 8); do
            echo "==> Health check attempt $attempt/8..."
            if curl -fsS --max-time 15 https://opsolid.de/api/health | tee /tmp/health.json; then
              echo ""
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Not ready yet, waiting 15s..."
            sleep 15
          done
          echo "Health check failed — container logs:"
          docker logs --tail 80 opsolid-app
          exit 1
