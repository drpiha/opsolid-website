name: Build Android Dev Client APK

# Builds a DEBUG / dev-client APK that does NOT embed a JS bundle — it
# connects to a Metro packager over Wi-Fi (Tailscale) every launch.
#
# Trigger manually from the Actions tab. Install ONCE on the phone, then
# every code change is delivered live by `npx expo start --dev-client`.
#
# Why a separate workflow from the release APK:
#   - Release APK   = production, bundle embedded, no Metro. For end users.
#   - Dev client    = debug, no bundle, talks to Metro. For development.
# Both are useful; we keep both.

on:
  workflow_dispatch:

jobs:
  build:
    name: Prebuild → Gradle Debug → GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS deps
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null \
            || yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses 2>/dev/null \
            || true

      - name: expo prebuild — generate Android project (dev client)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-devclient-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: gradlew permissions
        run: chmod +x mobile/android/gradlew

      - name: Build debug APK (dev client — no bundle, connects to Metro)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          APK="opsolid-android-devclient-${VERSION}-b${{ github.run_number }}.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-devclient-${{ github.run_number }}
          name: "OpSolid Android DEV CLIENT v0.1.0 — Build #${{ github.run_number }}"
          prerelease: true
          body: |
            ## OpSolid Android Dev Client APK — Build #${{ github.run_number }}

            **Bu APK Metro server'a bağlanır — JS bundle gömülü DEĞİL.**

            ### Telefona kurulum (tek seferlik)
            1. Telefondan bu sayfayı aç → `.apk` dosyasını indir
            2. Önceki OpSolid uygulaması varsa **kaldır** (imza farkı yüzünden üzerine kurulmaz)
            3. APK'ya dokunup kur

            ### Her geliştirme oturumu
            PC'de:
            ```
            cd mobile
            npm install
            npx expo start --dev-client --host=lan --port=43093
            ```
            Telefon ve PC aynı Tailnet'te olunca uygulama açılınca otomatik bağlanır.
            Kod değiştir → kaydet → telefon anında günceller.

            > Debug APK — geliştirme amaçlıdır, son kullanıcıya verilmez.
          files: ${{ env.APK }}
