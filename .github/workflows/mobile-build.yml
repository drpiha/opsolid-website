name: Build & Release Android APK

# Trigger manually from GitHub Actions tab — no Expo account, no EAS token needed.
# Builds a RELEASE APK (production mode, JS bundle always embedded, no Metro).
# Signs with a CI-generated keystore — fine for direct install / testing.

on:
  workflow_dispatch:

jobs:
  build:
    name: Prebuild → Gradle Release → GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS deps
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null \
            || yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses 2>/dev/null \
            || true

      - name: expo prebuild — generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore opsolid-release.keystore \
            -alias opsolid \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OpSolid, OU=Mobile, O=OpSolid, L=Munich, ST=Bavaria, C=DE" \
            -storepass opsolid123 -keypass opsolid123 2>/dev/null
          echo "Keystore generated"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: gradlew permissions
        run: chmod +x mobile/android/gradlew

      - name: Build release APK (production mode — bundle always embedded)
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/opsolid-release.keystore \
            -Pandroid.injected.signing.store.password=opsolid123 \
            -Pandroid.injected.signing.key.alias=opsolid \
            -Pandroid.injected.signing.key.password=opsolid123

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          APK="opsolid-android-${VERSION}-b${{ github.run_number }}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "OpSolid Android v0.1.0 — Build #${{ github.run_number }}"
          prerelease: true
          body: |
            ## OpSolid Android APK — Build #${{ github.run_number }}

            **Kurulum (WiFi gerekmiyor):**
            1. Aşağıdaki `.apk` dosyasına tıkla → indir
            2. Android → Ayarlar → Güvenlik → "Bilinmeyen kaynaklardan yükle" → Tarayıcı için aç
            3. APK'ya dokunup kur → OpSolid açılır

            > Release APK — production mode, JS bundle gömülü.
          files: ${{ env.APK }}
