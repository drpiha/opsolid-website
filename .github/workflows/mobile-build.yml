name: Build & Release Android APK

# Trigger manually from GitHub Actions tab — no Expo account, no EAS token needed.
# Uses expo prebuild (generates native Android project) + Gradle (builds the APK).
# Result: a GitHub Release with a downloadable .apk file.

on:
  workflow_dispatch:

jobs:
  build:
    name: Prebuild → Gradle → GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS deps
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null \
            || yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses 2>/dev/null \
            || true

      - name: expo prebuild — generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Enable JS bundle in debug APK (standalone, no Metro needed)
        run: echo "BUNDLE_IN_DEBUG=true" >> mobile/android/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: gradlew permissions
        run: chmod +x mobile/android/gradlew

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          APK="opsolid-android-${VERSION}-b${{ github.run_number }}.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "OpSolid Android v0.1.0 — Build #${{ github.run_number }}"
          prerelease: true
          body: |
            ## OpSolid Android APK — Build #${{ github.run_number }}

            **Kurulum (WiFi gerekmiyor):**
            1. Aşağıdaki `.apk` dosyasına tıkla → indir
            2. Android → Ayarlar → Güvenlik → "Bilinmeyen kaynaklardan yükle" → Tarayıcı için aç
            3. APK'ya dokunup kur → OpSolid açılır

            > Debug sürümü — test için. Üretim build'i Play Store'dan gelecek.
          files: ${{ env.APK }}
