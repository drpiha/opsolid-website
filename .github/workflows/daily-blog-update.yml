name: Daily Blog Research & Generation

on:
  schedule:
    # Runs every day at 07:00 UTC (09:00 Berlin time)
    - cron: "0 7 * * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install ts-node
        run: npm install -g ts-node typescript

      - name: Fetch RSS sources
        run: npx ts-node scripts/fetch-blog-sources.ts scripts/blog-sources.json

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: blog-sources
          path: scripts/blog-sources.json

  generate-article:
    needs: fetch-sources
    runs-on: ubuntu-latest
    # Only run if ANTHROPIC_API_KEY is set
    if: ${{ vars.ENABLE_BLOG_GENERATION == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci && npm install -g ts-node typescript

      - name: Download sources
        uses: actions/download-artifact@v4
        with:
          name: blog-sources
          path: scripts/

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx ts-node scripts/generate-blog-post.ts

      - name: Upload generated article
        uses: actions/upload-artifact@v4
        with:
          name: generated-article
          path: scripts/blog-generated-*.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "blog: auto-generated article from daily research"
          title: "[Blog] New auto-generated article"
          body: |
            ## Auto-Generated Blog Post

            This PR was created by the daily blog research workflow.

            **Source:** See the generated JSON in `scripts/` for details.

            ### Review Checklist
            - [ ] Article content is accurate and well-written
            - [ ] German translation reads naturally
            - [ ] Turkish translation reads naturally
            - [ ] No copyright issues with referenced sources
            - [ ] Article added to blog content system

            > Auto-generated by `.github/workflows/daily-blog-update.yml`
          branch: blog/auto-generated
          delete-branch: true
          labels: blog, auto-generated
