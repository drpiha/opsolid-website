<!--
  Verso v3 — Aperture Mark
  Eight blade-petals in turquoise meeting at a central ink pinhole.
  The aperture is "the moment of seeing someone's identity" — registering, not reading.
  Solid fills only. Tight 8-fold rotational symmetry.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Warm paper background -->
  <rect width="1024" height="1024" fill="#F4F1EC"/>

  <!-- Eight aperture blades. Each blade is a fat trapezoidal wedge spanning
       40° of the available 45° per slice, leaving a 5° gap that reads as
       blade-overlap. Inner radius 80, outer radius 340. -->
  <g transform="translate(512 512)">
    <defs>
      <path id="v3-blade"
        d="M 75.18 -27.36 L 319.49 -116.30 L 319.49 116.30 L 75.18 27.36 Z"
        fill="#1AA6B7"/>
    </defs>
    <use href="#v3-blade" transform="rotate(0)"/>
    <use href="#v3-blade" transform="rotate(45)"/>
    <use href="#v3-blade" transform="rotate(90)"/>
    <use href="#v3-blade" transform="rotate(135)"/>
    <use href="#v3-blade" transform="rotate(180)"/>
    <use href="#v3-blade" transform="rotate(225)"/>
    <use href="#v3-blade" transform="rotate(270)"/>
    <use href="#v3-blade" transform="rotate(315)"/>
  </g>

  <!-- Deep-teal asymmetric chord on each blade, suggesting blade-overlap depth.
       One wedge sliver per blade, rotated to match. Subtle but adds shutter feel. -->
  <g transform="translate(512 512)">
    <defs>
      <path id="v3-blade-shadow"
        d="M 75.18 27.36 L 319.49 116.30 L 200.00 64.00 Z"
        fill="#0F4F58" fill-opacity="0.55"/>
    </defs>
    <use href="#v3-blade-shadow" transform="rotate(0)"/>
    <use href="#v3-blade-shadow" transform="rotate(45)"/>
    <use href="#v3-blade-shadow" transform="rotate(90)"/>
    <use href="#v3-blade-shadow" transform="rotate(135)"/>
    <use href="#v3-blade-shadow" transform="rotate(180)"/>
    <use href="#v3-blade-shadow" transform="rotate(225)"/>
    <use href="#v3-blade-shadow" transform="rotate(270)"/>
    <use href="#v3-blade-shadow" transform="rotate(315)"/>
  </g>

  <!-- Central pinhole — the focused point of identity -->
  <circle cx="512" cy="512" r="76" fill="#0E1416"/>
</svg>
