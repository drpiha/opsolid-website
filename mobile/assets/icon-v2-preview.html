<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Icon V2 Preview</title>
<style>
  body { background:#1a1a1a; margin:0; padding:24px; font-family:-apple-system,Segoe UI,sans-serif; color:#eee }
  .row { display:flex; gap:32px; justify-content:center; align-items:flex-end; margin-bottom:32px }
  .item { text-align:center }
  .label { margin-top:12px; font-size:13px; opacity:.85 }
  .name { font-weight:600; font-size:14px; opacity:1; margin-top:6px }
  img.full { width:240px; height:240px; border-radius:54px; box-shadow:0 12px 40px rgba(0,0,0,.6) }
  img.tiny { width:48px; height:48px; border-radius:11px; box-shadow:0 2px 6px rgba(0,0,0,.7) }
  .scaleHeader { font-size:11px; opacity:.55; text-align:center; margin:8px 0 14px; letter-spacing:.08em; text-transform:uppercase }
</style></head>
<body>
<div class="scaleHeader">240 × 240 — iOS rounded-square at large</div>
<div class="row">
  <div class="item">
    <img class="full" src="icon-v2-capital-v.svg">
    <div class="name">Capital V</div>
    <div class="label">Didone Colophon — ink + turquoise split</div>
  </div>
  <div class="item">
    <img class="full" src="icon-v2-engraved.svg">
    <div class="name">Engraved</div>
    <div class="label">Letterpress deboss — turquoise on paper</div>
  </div>
  <div class="item">
    <img class="full" src="icon-v2-wax-seal.svg">
    <div class="name">Wax Seal</div>
    <div class="label">Heraldic disc — disc-in-square contrast</div>
  </div>
</div>
<div class="scaleHeader">48 × 48 — notification dot scale, silhouette test</div>
<div class="row">
  <div class="item">
    <img class="tiny" src="icon-v2-capital-v.svg">
    <div class="label" style="font-size:11px;margin-top:8px">Capital V</div>
  </div>
  <div class="item">
    <img class="tiny" src="icon-v2-engraved.svg">
    <div class="label" style="font-size:11px;margin-top:8px">Engraved</div>
  </div>
  <div class="item">
    <img class="tiny" src="icon-v2-wax-seal.svg">
    <div class="label" style="font-size:11px;margin-top:8px">Wax Seal</div>
  </div>
</div>
</body></html>
