<!--
  Concept 1: "Presence Ring" — Abstract Glyph
  Idea: A bold central disc flanked by two asymmetric arcs, like a radar ping
  frozen mid-broadcast. Reads as "someone is here / transmitting identity."
  The asymmetry (outer arc heavier than inner) prevents the cliché of a
  perfect concentric-rings Wi-Fi icon and creates a confident, weighted feel.
  At 48px it collapses to a dot-with-wings silhouette that is still distinctive.
  Color roles: turquoise #14B8A6 as gradient surface (background energy),
  white #FFFFFF as glyph fill (identity sits on top, clean and legible),
  ink #15120F as a subtle inner shadow ring to separate the disc from the arcs.
  iOS rounded-square mask: all critical geometry is centered within the safe
  zone (roughly 180px inset from each corner at 1024px), so corner cropping
  removes only the gradient fade, not the glyph.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Primary teal-to-deeper-teal gradient for the background -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1DE9D5"/>
      <stop offset="55%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0E8A7C"/>
    </linearGradient>

    <!-- Subtle radial vignette to add depth without glassmorphism -->
    <radialGradient id="vignette" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B6B60" stop-opacity="0.22"/>
    </radialGradient>

    <!-- Soft drop shadow for the white glyph to lift it off the background -->
    <filter id="glyph-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#0B6B60" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background fill -->
  <rect width="1024" height="1024" fill="url(#bg-grad)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!--
    GLYPH: White presence-ring mark.
    Three elements: outer arc (heavy, ~270°), inner arc (lighter, ~200°),
    central disc. All white. The gap in the outer arc points top-right —
    an intentional open angle that prevents visual closure and suggests
    "reaching outward."
    All paths constructed on a 512,512 center with radius units.
  -->

  <g filter="url(#glyph-shadow)" fill="none">

    <!-- Outer arc: 270° sweep, stroke-width 72, starting from 135° (SW) going clockwise to 45° (NE) -->
    <!-- Arc center: 512,512  Outer radius: 292 -->
    <path
      d="
        M 305.6 718.4
        A 292 292 0 1 1 718.4 305.6
      "
      stroke="#FFFFFF"
      stroke-width="72"
      stroke-linecap="round"
    />

    <!-- Inner arc: 195° sweep, stroke-width 52, offset so gap aligns opposite -->
    <!-- Radius: 176 -->
    <path
      d="
        M 386.2 741.0
        A 176 176 0 0 1 336.0 336.0
        A 176 176 0 0 1 741.0 386.2
      "
      stroke="#FFFFFF"
      stroke-width="52"
      stroke-linecap="round"
    />

  </g>

  <!-- Central disc: solid white, 108px radius — bold anchor point -->
  <circle cx="512" cy="512" r="108" fill="#FFFFFF" filter="url(#glyph-shadow)"/>

  <!-- Ink accent ring inside disc to create a pupil-like depth -->
  <circle cx="512" cy="512" r="52" fill="#15120F" opacity="0.88"/>

  <!-- Small turquoise inner dot — the "live" indicator inside the pupil -->
  <circle cx="512" cy="512" r="22" fill="#1DE9D5"/>

</svg>
