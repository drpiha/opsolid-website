<!--
  Verso v5 adaptive-icon foreground (Android 8+).
  Same Add Contact glyph but no background fill (transparent).
  Android composes adaptiveIcon.backgroundColor: #1AA6B7 behind it.
  Glyph mass scaled to fit Android's 432×432 safe circle inside the 1024 canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Person silhouette (left-center, scaled into safe circle) -->
  <circle cx="420" cy="478" r="76" fill="#FFFFFF"/>
  <path d="M 328 692 L 328 596 Q 328 520 420 520 Q 512 520 512 596 L 512 692 Z" fill="#FFFFFF"/>

  <!-- Bold "+" upper-right of person, dominant within safe circle -->
  <g stroke="#FFFFFF" stroke-width="48" stroke-linecap="round">
    <line x1="528" y1="412" x2="704" y2="412"/>
    <line x1="616" y1="324" x2="616" y2="500"/>
  </g>
</svg>
